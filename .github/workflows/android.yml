name: Android CI/CD

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125 platforms;android-34 build-tools;34.0.0'

      - name: Configure Android NDK & SDK Environment
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK 26.1.10909125 via sdkmanager..."
            sdkmanager --install "ndk;26.1.10909125"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

          # Locate Android Build-Tools (zipalign, apksigner) and export to PATH
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -f "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "Installing build-tools;34.0.0 via sdkmanager..."
            sdkmanager --install "build-tools;34.0.0" "platforms;android-34"
            BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/34.0.0"
          fi
          echo "Found Android Build-Tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

          # Optimize Gradle build performance in CI
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang llvm lld

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          # Backup custom manifest, resources and kotlin services before any init
          mkdir -p /tmp/voxp2p_android_backup
          if [ -d src-tauri/gen/android ]; then
            cp -r src-tauri/gen/android/* /tmp/voxp2p_android_backup/ 2>/dev/null || true
          fi

          if [ ! -f src-tauri/gen/android/gradlew ]; then
            echo "Generating Gradle Android container with Tauri CLI..."
            npx tauri android init --skip-targets-install --ci
          fi

          # Restore custom manifest, resources and kotlin services
          if [ -d /tmp/voxp2p_android_backup ]; then
            cp -rf /tmp/voxp2p_android_backup/* src-tauri/gen/android/ 2>/dev/null || true
          fi

          # Ensure AppCompat theme definitions exist in res/values and res/values-night
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          mkdir -p src-tauri/gen/android/app/src/main/res/values-night

          cat << 'EOF' > src-tauri/gen/android/app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.VoxP2P" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="Theme.voxp2p" parent="Theme.VoxP2P" />
              <style name="Theme.vox_p2p" parent="Theme.VoxP2P" />
          </resources>
          EOF

          cat << 'EOF' > src-tauri/gen/android/app/src/main/res/values-night/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.VoxP2P" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="windowActionBar">false</item>
                  <item name="android:windowFullscreen">false</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="Theme.voxp2p" parent="Theme.VoxP2P" />
              <style name="Theme.vox_p2p" parent="Theme.VoxP2P" />
          </resources>
          EOF

          # Ensure AndroidManifest.xml has android:theme configured
          MANIFEST_PATH="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ] && ! grep -q "android:theme" "$MANIFEST_PATH"; then
            echo "Injecting android:theme into AndroidManifest.xml..."
            sed -i 's/<application/<application\n        android:theme="@style\/Theme.VoxP2P"/' "$MANIFEST_PATH"
          fi

          # Ensure minSdk is 29 (Android 10+) and targetSdk/compileSdk are 34 in all Gradle files
          if [ -d src-tauri/gen/android ]; then
            find src-tauri/gen/android -type f \( -name "*.gradle.kts" -o -name "*.gradle" \) | while read -r f; do
              sed -i -E 's/minSdk\s*=\s*[0-9]+/minSdk = 29/g' "$f" 2>/dev/null || true
              sed -i -E 's/minSdkVersion\s*=\s*[0-9]+/minSdkVersion = 29/g' "$f" 2>/dev/null || true
              sed -i -E 's/minSdkVersion\s+[0-9]+/minSdkVersion 29/g' "$f" 2>/dev/null || true
              sed -i -E 's/minSdk\.set\([0-9]+\)/minSdk.set(29)/g' "$f" 2>/dev/null || true

              sed -i -E 's/compileSdk\s*=\s*([0-2][0-9]|3[0-3])\b/compileSdk = 34/g' "$f" 2>/dev/null || true
              sed -i -E 's/compileSdkVersion\s*=\s*([0-2][0-9]|3[0-3])\b/compileSdkVersion = 34/g' "$f" 2>/dev/null || true
              sed -i -E 's/compileSdkVersion\s+([0-2][0-9]|3[0-3])\b/compileSdkVersion 34/g' "$f" 2>/dev/null || true
              sed -i -E 's/compileSdk\.set\(([0-2][0-9]|3[0-3])\)/compileSdk.set(34)/g' "$f" 2>/dev/null || true

              sed -i -E 's/targetSdk\s*=\s*([0-2][0-9]|3[0-3])\b/targetSdk = 34/g' "$f" 2>/dev/null || true
              sed -i -E 's/targetSdkVersion\s*=\s*([0-2][0-9]|3[0-3])\b/targetSdkVersion = 34/g' "$f" 2>/dev/null || true
              sed -i -E 's/targetSdkVersion\s+([0-2][0-9]|3[0-3])\b/targetSdkVersion 34/g' "$f" 2>/dev/null || true
              sed -i -E 's/targetSdk\.set\(([0-2][0-9]|3[0-3])\)/targetSdk.set(34)/g' "$f" 2>/dev/null || true
            done
          fi

          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true

      - name: Build Tauri Android APK
        run: npm run tauri android build -- --apk --ci --target aarch64 armv7 x86_64 --split-per-abi
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Align, Sign and Verify APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          # Ensure Android SDK Build-Tools (zipalign, apksigner) are available
          if ! command -v zipalign &>/dev/null || ! command -v apksigner &>/dev/null; then
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$BUILD_TOOLS_DIR" ]; then
              export PATH="$BUILD_TOOLS_DIR:$PATH"
            fi
          fi

          echo "Using zipalign at: $(command -v zipalign || echo 'NOT FOUND')"
          echo "Using apksigner at: $(command -v apksigner || echo 'NOT FOUND')"

          if ! command -v zipalign &>/dev/null || ! command -v apksigner &>/dev/null; then
            echo "Error: zipalign or apksigner not found in PATH or $ANDROID_HOME/build-tools/"
            exit 1
          fi

          KEYSTORE_PATH="/tmp/release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo ">>> [Sign] Found ANDROID_KEYSTORE_BASE64 secret. Decoding production keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-voxp2p}"
            STORE_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$STORE_PASS}"
          else
            echo ">>> [Sign] No ANDROID_KEYSTORE_BASE64 secret provided."
            echo ">>> [Sign] Generating autonomous CI release keystore via keytool (RSA 2048, 10,000 days validity)..."
            KEY_ALIAS="voxp2p-ci"
            STORE_PASS="voxp2p_ci_pass_2026"
            KEY_PASS="voxp2p_ci_pass_2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=VoxP2P CI, OU=Mobile Release, O=VoxP2P, L=OpenSource, ST=Global, C=US"
          fi

          mkdir -p dist-android
          APP_VERSION=$(node -p "require('./package.json').version")
          echo "Packaging signed release for version: $APP_VERSION"

          # Discover all built release APKs
          APK_FILES=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" ! -name "*aligned*" ! -name "*-signed.apk")
          if [ -z "$APK_FILES" ]; then
            echo "Error: No APK files found in src-tauri/gen/android/app/build/outputs/apk"
            exit 1
          fi

          for apk in $APK_FILES; do
            echo "========================================================"
            echo "Processing APK: $apk"
            base_name=$(basename "$apk" .apk)

            # Determine architecture suffix
            arch=""
            if [[ "$base_name" =~ (arm64-v8a|aarch64) ]]; then
              arch="arm64-v8a"
            elif [[ "$base_name" =~ (armeabi-v7a|armv7) ]]; then
              arch="armv7"
            elif [[ "$base_name" =~ (x86_64) ]]; then
              arch="x86_64"
            elif [[ "$base_name" =~ (universal) ]]; then
              arch="universal"
            else
              # Inspect native libraries inside APK
              has_arm64=$(unzip -l "$apk" 2>/dev/null | grep -c "lib/arm64-v8a" || true)
              has_armv7=$(unzip -l "$apk" 2>/dev/null | grep -c "lib/armeabi-v7a" || true)
              has_x86_64=$(unzip -l "$apk" 2>/dev/null | grep -c "lib/x86_64" || true)
              abi_count=0
              [ "$has_arm64" -gt 0 ] && abi_count=$((abi_count + 1))
              [ "$has_armv7" -gt 0 ] && abi_count=$((abi_count + 1))
              [ "$has_x86_64" -gt 0 ] && abi_count=$((abi_count + 1))

              if [ "$abi_count" -gt 1 ]; then
                arch="universal"
              elif [ "$has_arm64" -gt 0 ]; then
                arch="arm64-v8a"
              elif [ "$has_armv7" -gt 0 ]; then
                arch="armv7"
              elif [ "$has_x86_64" -gt 0 ]; then
                arch="x86_64"
              else
                arch="universal"
              fi
            fi

            out_apk="dist-android/voxp2p-v${APP_VERSION}-android-${arch}-signed.apk"
            aligned_apk="/tmp/aligned_${arch}_$$.apk"

            echo "[1/3] Aligning APK with zipalign (4-byte alignment, page-align .so)..."
            zipalign -f -v -p 4 "$apk" "$aligned_apk"

            echo "[2/3] Signing APK with apksigner (v1, v2, v3 schemes)..."
            apksigner sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "$out_apk" \
              "$aligned_apk"

            echo "[3/3] Verifying digital signature with apksigner verify --verbose..."
            apksigner verify --verbose "$out_apk"

            rm -f "$aligned_apk"
            echo ">>> Successfully verified and created: $out_apk"
          done

          # Securely cleanup keystore
          rm -f "$KEYSTORE_PATH"

          echo "========================================================"
          echo "Generated signed release artifacts:"
          ls -lh dist-android/

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxp2p-android-signed-apks
          path: dist-android/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-android/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
