name: Android CI/CD

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125'

      - name: Configure Android NDK Environment
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Installing NDK 26.1.10909125 via sdkmanager..."
            sdkmanager --install "ndk;26.1.10909125"
          fi
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          targets: 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang llvm lld

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          # Backup custom manifest and kotlin services before any init
          mkdir -p /tmp/voxp2p_android_backup
          if [ -d src-tauri/gen/android ]; then
            cp -r src-tauri/gen/android/* /tmp/voxp2p_android_backup/ 2>/dev/null || true
          fi

          if [ ! -f src-tauri/gen/android/gradlew ]; then
            echo "Generating Gradle Android container with Tauri CLI..."
            npx tauri android init --skip-targets-install --ci
          fi

          # Restore custom manifest and kotlin services
          if [ -d /tmp/voxp2p_android_backup ]; then
            cp -rf /tmp/voxp2p_android_backup/* src-tauri/gen/android/ 2>/dev/null || true
          fi

          # Ensure minSdk is at least 26 for AAudio in Gradle build files
          if [ -d src-tauri/gen/android ]; then
            find src-tauri/gen/android -name "*.gradle.kts" -o -name "*.gradle" | while read -r f; do
              sed -i 's/minSdk = 24/minSdk = 26/g' "$f" 2>/dev/null || true
              sed -i 's/minSdkVersion = 24/minSdkVersion = 26/g' "$f" 2>/dev/null || true
              sed -i 's/minSdkVersion 24/minSdkVersion 26/g' "$f" 2>/dev/null || true
            done
          fi

          chmod +x src-tauri/gen/android/gradlew 2>/dev/null || true

      - name: Build Tauri Android APK
        run: npm run tauri android build -- --apk --target aarch64 armv7 x86_64
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxp2p-android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
